# 本包插入自身（bundle 层）：缺省**开启**（模型侧工具，首期只启用 python 语言）。
# 其余配置项缺省见 src/index.ts 的 resolveSettings（languages = ["python"]、approval = never、
# timeoutMs = 30000、maxOutputChars = 100000、spillPrefix = dsh-script-）；
# 要覆盖时在 profile 用户 patch 里按 id 追加同名字段。
- insert:
    - id: script-interpreter
      name: '@dsh-toolset/script-interpreter'
