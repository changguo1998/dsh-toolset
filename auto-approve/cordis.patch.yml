# auto-approve 插件的 dsh bundle 声明。
# dsh 宿主按 package.json 的 dsh.bundle.patch 加载本文件，把自动审批应答者挂进进程内。
#
# 缺省按 R6 裁定：enabled: true + mode: rules（灰区落人工面板、零 token），四张名单缺省全空
# —— 默认只在只读类与指纹上生效。要启用 LLM 灰区审查须显式改 mode: rules+llm。
# pi-lens-ignore: yaml-schema: JSONPatch:0, yaml-schema: JSONPatch:513
- insert:
    - id: auto-approve
      name: '@dsh-toolset/auto-approve'
      config:
        enabled: true
        mode: rules
        # worktree 内的 git 提交要写工作区外的 .git（索引 / objects / refs），会请求升级到
        # danger-full-access；这里放行三种简单形态，正则锚定整串并排除复合命令。
        # deny.escalation.to 优先于本层，需要收紧的用户仍可用拒绝名单覆盖。
        escalation:
          mode: match
          allow:
            - id: git-worktree-commit
              match: '^git +(?:-C +[^ ]+ +)?(?:add|commit|tag)(?: +[^;&|]*)?$'
              to: ['danger-full-access']
