# 示例 profile 的用户层 patch（复制为 ~/.dsh/profiles/<名字>/cordis.patch.yml 后按需增删）。
#
# 组合顺序：dsh-base bundle 层 → 本 profile `dsh.profile.bundles` 各 bundle 层
# （每个 bundle 由自己 package.json 的 `dsh.bundle.patch` 声明，多为 `- insert:` 行）
# → 本文件（用户层）→ 命令行 `--patch <文件>` 覆盖层。后层按 id 命中前层条目。
#
# 两种写法：
#   1) 改已有条目：`- id: <条目 id>` + `config` / `disabled`；name 必须与原条目一致
#      （不一致整条跳过并告警），所以改指向要用 insert 新增，不能靠改 name。
#   2) 新增条目：`- insert:` + 条目列表；不带 id 插到顶层，带 id 插进该 group。
#
# 注意：config 是整键替换（dsh-app-boot 的 composeEntries → cordis-plugin-include 的
# applyEntryPatches 里 `target[key] = value`），未重述的字段回落到插件 schema 默认值，
# 而不是上一层 bundle 的值——覆盖带默认表的条目时尤其要记住。
#
# 隐私口径：本资产对齐当前 fff 的通用挂载形态，不含私有 provider / 模型名 / 端点 /
# apiKeyEnv。模型相关的个人配置（agent-default-model / llm-pi-ai / 会话标题路由）一律用
# `PROVIDER` / `MODEL` 占位，复制后替换成你自己的。
#
# LSP 会把本文件误按 JSON Patch schema 校验；`insert` 是 dsh 官方 patch DSL，
# 下一行内联抑制该误报（与各插件包自带的 cordis.patch.yml 同一写法）。
# pi-lens-ignore: yaml-schema: JSONPatch:0, yaml-schema: JSONPatch:513

# ── 本仓库插件通用条目（与 fff 一致；无个人配置）─────────────────────────
- id: herdr-integration
  name: '@dsh-toolset/herdr-integration'

- id: tui
  name: '@dsh-toolset/tui'
  config:
    theme: dark

- id: ast-tools
  name: '@dsh-toolset/ast-tools'

- id: fs-digest
  name: '@dsh-toolset/fs-digest'

- id: goal-contract
  name: '@dsh-toolset/goal-contract'

- id: hash-edit
  name: '@dsh-toolset/hash-edit'

- id: metric-loop
  name: '@dsh-toolset/metric-loop'

- id: output-compress
  name: '@dsh-toolset/output-compress'

- id: security-guard
  name: '@dsh-toolset/security-guard'

- id: code-map
  name: '@dsh-toolset/code-map'

# 会话目录编码服务（session-paths）：由 bundles 挂载，且排在 memory-base 之前，
# 保证服务先注册（memory-base 的 S 库、output-compress 的 digest.db 都经它取会话目录）。
# 本条目无需用户层配置（sessions 根缺省 $DSH_HOME/sessions）；要改根时按 id 覆盖：
# - id: session-paths
#   name: '@dsh-toolset/session-paths'
#   config:
#     root: /path/to/sessions

# 分层记忆存储：库落点按层推导（U = dshHome 下、P = 项目根 `.dsh/`、S = 宿主会话目录），
# 无单库 dbPath 配置（该键已随 2026-10-17 改制废弃）；库在首次写入时才创建。这里只给缺省归属项目键。
- id: memory-base
  name: '@dsh-toolset/memory-base'
  config:
    project: 'my-project'

# goal 默认回合上限：宿主 dsh-goal 的 Config 默认 defaultMaxGoalRounds=256，这里抬到 999。
# patch 按 id 整键替换 config，故只重述要改的字段；不可写 name（否则被当成新增行而整条跳过）。
- id: goal
  config:
    defaultMaxGoalRounds: 999

# ── 模块热重载（由 install.sh 生成，勿在此手写）──────────────────────────────
# base 组合包以 `root: []` 启用 HMR —— 只监听 profile patch，插件代码改动要重启才生效。
# install.sh 会在本文件末尾追加生成区（以 `# install.sh generated: hmr-root-begin` 开头）：
# `hmr.base` 写安装时的仓库绝对路径，`root: ['.']` 相对 base 落回仓库；hmr 默认的 baseDir
# 是 profile 目录（ctx.baseUrl 取 `<profile>/cordis.yml` 所在目录），只写 root 会停在 profile
# 里，而且 ignored 按相对 baseDir 的路径匹配——带 `..` 前缀时 `**/node_modules` 全部失效。
# 生成区同时忽略文档类文件（`**/*.md` / `**/docs/**`，不参与重载，只减事件）。
# 要自定义就删掉生成区、手写 `- id: hmr`（脚本检测到手写行后不再追加）。
# 删除生成区 = 回到「改代码后重启」。

# ── 规则触发（rule-engine）────────────────────────────────────────────────────
# 只保留启用中的规则示例；停用的规则不写进资产。规则写在 patch 里随仓库追踪；
# ~/.dsh/rule-engine/rules.json 是工具族增删改的运行时层（不入库），两层同 id 时运行时版
# 就地替换基线，故基线要生效须先清掉同 id 条目。
- id: rule-engine
  config:
    rules:
      # 恢复 / 重载会话时注入提示。`predicates: [session-resumed]` 只命中「从记录恢复 /
      # 重载」的会话（全新会话不命中，改用 session-fresh）；`directWrite: [session-start]`
      # 跳过 dedupeInRecord 记录判断，故每次重载都注入（否则第二次重载会因记录里已有同
      # summary 被拦）；`delivery: steer` 与符号规范消费者（symbol-normalizer，同为
      # `session-start` + `steer`）同节点同组 → 同一次触发合并为一条注入。
      - id: resumed-notice
        source: session-start
        match:
          predicates:
            - session-resumed
        directWrite:
          - session-start
        delivery: steer
        action:
          type: inject
          text: "看到这条消息代表会话被重新加载了"
          summary: "会话重新加载提示"

# behavior-correction：rule-engine 的 tools/pre-execute guard 消费者，拦「该用专用工具却
# 走 shell」的调用（缺省：bash 里跑 herdr -> 拒绝并指向 herdr_use 族工具）。config.rules
# 可整体替换缺省规则表，enabled: false 或 rules: [] 等于不拦；未配 config 时用内置缺省。
- insert:
    - id: behavior-correction
      name: '@dsh-toolset/behavior-correction'

# 自动会话压缩（compaction-basic）阈值：默认 0.8（已路由模型上下文窗口的比例），
# 这里提前到 0.5 触发。patch 按 id 替换整行 config，故只重述要改的字段，
# 其余保持插件默认：retainRatio 0.16 / maxTokens 8192 / compactionRetries 1 / auto true。
- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.5

# ── 会话标题：profile 的 patch 层语义（cordis-plugin-include）────────────────
# 改已有条目用 `- id:` + config/disabled（不可改 name，否则整条跳过），新增用 `- insert:`。
# 1) 禁用 dsh-base 挂载的 first-prompt provider：它只在首条人类消息时生成一次，且宿主
#    配置未给 provider/model，首条消息时"已记录的请求路由"尚不存在 → 回落确定性 fallback，
#    标题被 fallbackMaxBytes=40（UTF-8 字节）截断（中文约 13 字），看起来远短于标题栏宽度；
#    ctx.sessionTitle 上只允许注册一个 provider（二次注册抛错），故必须先禁用。
- id: session-title-llm
  disabled: true

# 2) 标题 provider 二选一（宿主只允许一个；下面的行默认**注释**，接入时取消注释并替换
#    provider / model 为你的路由，依赖：profile 的 package.json 需含对应官方包）。带
#    `scripts/install.sh --sync --take-over-title` 时脚本会按 patch 内容自动补齐生成区。
# 2a) 官方 all-prompts 变体（每条用户消息后重算标题）：provider/model 必须成对提供；
#     targetCjkCharacters 为中文目标字数。
# - insert:
#     - id: session-title-all-prompts-llm
#       name: '@deepseek-ai/dsh-session-title-all-prompts-llm'
#       config:
#         provider: PROVIDER
#         model: MODEL
#         targetWords: 5
#         targetCjkCharacters: 15
#         maxInputBytes: 32768
#         maxOutputTokens: 512
#         timeoutMs: 60000
# 2b) 本仓库实现 session-title-cutoff（all-prompts 触发不变，参考窗口改为「最近一次
#     git commit 之后」）：接 2a 时需禁用官方行（二次注册会抛错），并显式给路由。
# - id: session-title-all-prompts-llm
#   disabled: true
# - id: session-title-cutoff
#   config:
#     provider: PROVIDER
#     model: MODEL

# ── 个人模型配置（占位骨架，复制后替换；不写真实值进仓库资产）────────────────
# agent-default-model：会话默认模型。provider / model 必须成对且已在 llm-pi-ai 声明。
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: PROVIDER
    model: MODEL
    reasoningEffort: max

# llm-pi-ai：私有 provider 定义。apiKeyEnv 指环境变量名，baseURL 为你的私有端点，
# models 按需增删（这里只留一个 MODEL 示例）。
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      PROVIDER:
        api: openai-completions
        apiKeyEnv: PROVIDER_API_KEY   # 私有环境变量名，复制后替换
        baseURL: https://PROVIDER.example/v1   # 私有端点，复制后替换
        reasoning: max
        compat:
          supportsDeveloperRole: false
        models:
          - id: MODEL
            contextWindow: 262144

# ── DeepSeek 账号登录链：本项目不挂载（2026-10-06 用户核实）──────────────────
# 账号登录（浏览器 PKCE）仅**桌面版**支持，Linux web / CLI 只支持 API key；本项目是
# TUI + Linux，两条都用不上：
#   deepseek-account     = dsh-deepseek-account-platform（PKCE 登录 + /oauth/callback）
#   llm-deepseek-account = dsh-llm-deepseek-account（账号 LLM 路由，未登录恒空目录）
# 影响面：ctx.deepseekAccount 的消费者只有上面第二条与 web-search-deepseek（仅当会话
# provider 为 deepseek-account 时才取账号 token）→ 禁用后 web 搜索回落 API key。
# 桌面版部署请删掉这两条（背景见仓库 docs/BACKLOG.md §6「挂起」）。
- id: deepseek-account
  disabled: true

- id: llm-deepseek-account
  disabled: true

# ── 可挂官方行（2026-10-02 挂载面扩张：投影 / 服务 / 事件面扩展，不改模型工具面）──────
# 新增行必须走 `- insert:`：直接写 `- id:/name:` 会被当成「覆盖既有行」，未命中时只打
# `patch: entry "x" not found` 且退出码仍为 0（静默失败）。候选池、排除口径见
# `docs/archived/2026-10-02-profile-mount-expansion.md`。
# 行缺 `config` 时宿主按该包 `Config` schema 校验 `undefined`：**含 `.required()` 字段**的行会
# 「entry did not activate」激活失败（`--dump-config` 查不出来，它不实例化插件）——如
# `message-feedback.maxNoteBytes`（必填；取值对齐上游 dsh-web-app 同款行）。
- insert:
    - id: session-stats
      name: '@deepseek-ai/dsh-session-stats'
    - id: session-turn-outline
      name: '@deepseek-ai/dsh-session-turn-outline'
    - id: session-reference
      name: '@deepseek-ai/dsh-session-reference'
    - id: message-feedback
      name: '@deepseek-ai/dsh-message-feedback'
      config:
        maxNoteBytes: 8192 # 必填（.required()）；对齐 dsh-web-app 同款行；缺 config 会激活失败
    - id: workspace-changes
      name: '@deepseek-ai/dsh-workspace-changes'
    - id: file-reference-local
      name: '@deepseek-ai/dsh-file-reference-local'
    - id: terminal
      name: '@deepseek-ai/dsh-terminal'
    - id: terminal-bash
      name: '@deepseek-ai/dsh-terminal-bash'
    - id: workspace
      name: '@deepseek-ai/dsh-workspace'

# ── ponytail（默认停挂）────────────────────────────────────────────────────
# 用 patch 层 disabled 关掉，而不是从 bundle 清单移除：bundle 清单由 install.sh 按
# canonical_pkgs 维护（与 CI 一致），恢复只需删掉本块。
- id: ponytail
  disabled: true
