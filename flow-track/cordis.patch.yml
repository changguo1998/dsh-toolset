# flow-track 插件的 dsh bundle 声明。
# 本包缺省开启：注册五个模型侧工具（flow_start 建树 + flow_record / flow_status / flow_remove /
# flow_rollback 记推进），并在回合边界经 pinNotes.hold 注入非树级内容（合规提示 / 最近记录）。
# 树级内容（阶段模板 / 推进状态）已退役：节点推进与当前节点推送由 task-engine 承担。
# 依赖 tools（装配期硬依赖）；memory-base / task-engine / pinNotes / flow-arbiter 缺席时各自降级。
# 覆盖配置时在 profile 用户 patch 里按 id 追加同名字段：
#   enabled（缺省见 src/index.ts 的 resolveConfig）。
- insert:
    - id: flow-track
      name: '@dsh-toolset/flow-track'
