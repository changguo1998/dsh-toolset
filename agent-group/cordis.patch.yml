# agent-group 插件的 dsh bundle 声明。
# 本包默认开启；用到两个服务（**执行期**可选读取，缺失只影响对应动作）：
# - sessionChannel（session-channel 插件）：投递指令 / 读取回报；
# - sessionPaths（session-paths 插件）：把组状态落管理者会话目录。
# 两个服务都不写进 `inject`，本包照常加载、`agent_group` 工具照常注册（注册期只硬要求宿主 `tools`）；
# 缺 sessionChannel / sessionPaths 时由调用返回 `session_channel_unavailable` / `session_paths_unavailable`
# 错误（原因 + 下一步，见 README「依赖与降级」）。
# 要覆盖配置时在 profile 用户 patch 里按 id 追加同名字段（见 README「配置」）。
- insert:
    - id: agent-group
      name: '@dsh-toolset/agent-group'
      config:
        enabled: true
