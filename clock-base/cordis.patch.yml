# timer 插件的 dsh bundle 声明。
# dsh 宿主按 package.json 的 dsh.bundle.patch 加载本文件，把服务 `clock` 挂进进程内。
# 服务名刻意与宿主 `cordis-plugin-timer` 的 `timer` 区分：本包不包装、不替代宿主 timer，
# 只提供「读钟 + 随调用方 fiber 释放的排期」；无配置项。
# 行顺序不带加载语义，激活由服务可用性驱动：无需把本行排在使用方之前。
# （scripts/install.sh 的 canonical_pkgs 顺序只用于安装与构建。）
- insert:
    - id: clock-base
      name: '@dsh-toolset/clock-base'
