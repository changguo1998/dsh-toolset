# 本包插入自身（bundle 层）：默认配置见下；provider/model 留空 = 复用会话当前记录的路由。
# 挂载前需在 profile 用户 patch 里禁用官方 `session-title-all-prompts-llm`
# （宿主只允许注册一个标题 provider）；`scripts/install.sh` 可一条命令完成更新。
- insert:
    - id: session-title-cutoff
      name: '@dsh-toolset/session-title-cutoff'
      config:
        targetWords: 5
        targetCjkCharacters: 15
        maxInputBytes: 32768
        maxOutputTokens: 512
        timeoutMs: 60000
