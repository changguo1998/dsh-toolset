# tool-consult bundle 层（2026-11-13 新机制）：
# 全量短清单常驻、14 个初始工具保留完整定义、白名单外的条件工具静态隐藏。
- insert:
    - id: tool-consult
      name: '@dsh-toolset/tool-consult'
      config:
        enabled: true
        initialTools:
          - bash
          - read
          - glob
          - grep
          - ask_user_question
          - skill
          - write
          - edit
          - read_image
          - web_search
          - web_fetch
          - job_output
          - job_list
          - job_kill
        allowedWhenTools:
          - web_search
          - web_fetch
        applyTo: roots
        maxResults: 5
        audit: false
