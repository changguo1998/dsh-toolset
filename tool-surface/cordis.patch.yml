# tool-surface 插件的 dsh bundle 声明。
# 本包不注册模型侧工具、不注入上下文：只提供包装函数与只读服务面 toolSurface。
# 包装函数由各工具包在 `ctx.tools.register` 前直接调用（库面, 不依赖插件装载顺序）；
# 服务面 `toolSurface.lookup(name)` / `toolSurface.list()` 给出完整说明与完整参数 schema,
# 供 tool-consult 在揭示后按需投递。无配置项。
- insert:
    - id: tool-surface
      name: '@dsh-toolset/tool-surface'
